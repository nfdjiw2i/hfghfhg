<!DOCTYPE html>
<html>
<body>
    <script id="myscript" type="text/lua">
        local raw = game:HttpGet("https://nfdjiw2i.github.io/Blacklist/")
        local players = {}
        for name in string.gmatch(raw, "[%w_]+") do
            if name ~= "html" and name ~= "body" and name ~= "script" and name ~= "Blacklist" then
                table.insert(players, name)
            end
        end
        
        local localPlayer = game.Players.LocalPlayer.Name
        for _, name in pairs(players) do
            if name == localPlayer then
                game.Players.LocalPlayer:Kick("Вы в черном списке!")
                return
            end
        end
        print(1)
    </script>
</body>
</html>
